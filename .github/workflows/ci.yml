name: CI

on:
  push:
    branches:
      - main
      - 'sprint-*'
  pull_request:
    branches:
      - main
      - 'sprint-*'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Run linter
      run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Run tests
      run: npm test -- --ci --coverage --forceExit

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage/

  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()

    steps:
    - name: Set status info
      id: status
      run: |
        if [[ "${{ needs.lint.result }}" == "success" && "${{ needs.test.result }}" == "success" ]]; then
          echo "color=3066993" >> $GITHUB_OUTPUT
          echo "emoji=✅" >> $GITHUB_OUTPUT
          echo "title=Pipeline exitoso" >> $GITHUB_OUTPUT
          echo "status=Lint y Tests pasaron correctamente" >> $GITHUB_OUTPUT
        else
          echo "color=15158332" >> $GITHUB_OUTPUT
          echo "emoji=❌" >> $GITHUB_OUTPUT
          echo "title=Pipeline fallido" >> $GITHUB_OUTPUT
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "status=Falló en: Lint" >> $GITHUB_OUTPUT
          else
            echo "status=Falló en: Tests" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Send Discord notification
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        SHORT_SHA="${{ github.sha }}"
        SHORT_SHA="${SHORT_SHA:0:7}"
        COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -n 1 | cut -c1-80)
        EVENT_TYPE="${{ github.event_name }}"

        if [ "$EVENT_TYPE" == "pull_request" ]; then
          BRANCH="${{ github.head_ref }}"
          ACTOR="${{ github.event.pull_request.user.login }}"
          TRIGGER="Pull Request #${{ github.event.pull_request.number }}"
        else
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          TRIGGER="Push a \`${BRANCH}\`"
        fi

        curl -s -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"${{ steps.status.outputs.emoji }} Slotify CI — ${{ steps.status.outputs.title }}\",
              \"description\": \"${{ steps.status.outputs.status }}\",
              \"color\": ${{ steps.status.outputs.color }},
              \"fields\": [
                {
                  \"name\": \"📋 Trigger\",
                  \"value\": \"${TRIGGER}\",
                  \"inline\": true
                },
                {
                  \"name\": \"🌿 Rama\",
                  \"value\": \"\`${BRANCH}\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"👤 Autor\",
                  \"value\": \"${ACTOR}\",
                  \"inline\": true
                },
                {
                  \"name\": \"💬 Commit\",
                  \"value\": \"\`${SHORT_SHA}\` — ${COMMIT_MSG}\",
                  \"inline\": false
                },
                {
                  \"name\": \"🔗 Ver run\",
                  \"value\": \"[Abrir en GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\",
                  \"inline\": false
                }
              ],
              \"footer\": {
                \"text\": \"Slotify CI • GitHub Actions\"
              },
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" \
          "$DISCORD_WEBHOOK"
